<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>TCC – Teste de Endpoints (Event Sourcing)</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #111; background: #fff; }
    h1 { font-size: 1.4rem; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 24px; }
    h2 { font-size: 1rem; margin: 0 0 10px; }
    section { border: 1px solid #ccc; border-radius: 4px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; }
    input, select { padding: 6px 8px; border: 1px solid #999; border-radius: 3px; font-size: 0.9rem; margin-bottom: 6px; }
    button { padding: 7px 16px; background: #111; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #444; }
    pre { margin-top: 10px; background: #f5f5f5; border: 1px solid #ddd; padding: 10px; border-radius: 3px; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; min-height: 32px; }
  </style>
</head>
<body>

<h1>TCC — Teste de Endpoints (Event Sourcing)</h1>

<section>
  <h2>POST /cliente — Criar Cliente</h2>
  <label>Nome: <input id="c-nome" type="text" placeholder="João Silva" /></label>
  <label>CPF: <input id="c-cpf" type="text" placeholder="12345678900" /></label>
  <label>Email: <input id="c-email" type="text" placeholder="joao@id.uff.com" /></label>
  <button onclick="criarCliente()">Criar</button>
  <pre id="r-criarCliente">—</pre>
</section>

<section>
  <h2>GET /cliente/{id} — Buscar Cliente</h2>
  <label>ID: <input id="g-clienteId" type="number" placeholder="1" /></label>
  <button onclick="buscarCliente()">Buscar</button>
  <pre id="r-buscarCliente">—</pre>
</section>

<section>
  <h2>GET /carteira/{id} — Buscar Carteira</h2>
  <label>ID da Carteira: <input id="g-carteiraId" type="number" placeholder="1" /></label>
  <button onclick="buscarCarteira()">Buscar</button>
  <pre id="r-buscarCarteira">—</pre>
</section>

<section>
  <h2>POST /carteira/{id}/eventos — Registrar Evento</h2>
  <label>ID da Carteira: <input id="e-carteiraId" type="number" placeholder="1" /></label>
  <label>Tipo: <select id="e-tipo"><option value="DEPOSITO">DEPOSITO</option><option value="SAQUE">SAQUE</option></select></label>
  <label>Valor: <input id="e-valor" type="number" step="0.01" placeholder="100.00" /></label>
  <button onclick="registrarEvento()">Enviar</button>
  <pre id="r-evento">—</pre>
</section>

<section>
  <h2>GET /carteira/{id}/view — Projeção da Carteira (Saldo e Histórico)</h2>
  <label>ID da Carteira: <input id="v-carteiraId" type="number" placeholder="1" /></label>
  <button onclick="buscarView()">Buscar</button>
  <pre id="r-view">—</pre>
</section>

<script>
  async function req(method, url, body, elId) {
    const el = document.getElementById(elId);
    el.textContent = 'Aguardando...';
    try {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = text; }
      el.textContent = res.status + ' ' + res.statusText + '\n\n' + JSON.stringify(data, null, 2);
    } catch (e) {
      el.textContent = 'Erro: ' + e.message;
    }
  }

  function criarCliente() {
    req('POST', '/cliente', { nome: document.getElementById('c-nome').value, cpf: document.getElementById('c-cpf').value, email: document.getElementById('c-email').value }, 'r-criarCliente');
  }
  function buscarCliente() {
    req('GET', '/cliente/' + document.getElementById('g-clienteId').value, undefined, 'r-buscarCliente');
  }
  function buscarCarteira() {
    req('GET', '/carteira/' + document.getElementById('g-carteiraId').value, undefined, 'r-buscarCarteira');
  }
  function registrarEvento() {
    req('POST', '/carteira/' + document.getElementById('e-carteiraId').value + '/eventos',
      { tipo: document.getElementById('e-tipo').value, valor: parseFloat(document.getElementById('e-valor').value) },
      'r-evento');
  }
  function buscarView() {
    req('GET', '/carteira/' + document.getElementById('v-carteiraId').value + '/view', undefined, 'r-view');
  }
</script>

</body>
</html>
